services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: dopis-pocketbase
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./pb_data:/pb_data
      - ./pb_migrations:/pb_migrations
    environment:
      - PB_ENCRYPTION_KEY=${SECRET_KEY:-default_dopis_pocketbase_key_32c}
      - PB_ADMIN_EMAIL=${POCKETBASE_ADMIN_EMAIL:-admin@dopis.local}
      - PB_ADMIN_PASSWORD=${POCKETBASE_ADMIN_PASSWORD:-dopis_admin_secret_1234}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
